<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fff8f2">
  <title>Acceso de organizadores</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="form-card login-card">
    <a class="back-link" href="index.html">← Volver a la invitación</a>
    <p class="eyebrow">Administración</p>
    <h1>Acceso de organizadores</h1>
    <p class="intro">Inicia sesión para consultar las respuestas de tus eventos.</p>

    <div id="login-message" class="notice" role="status" aria-live="polite" hidden></div>

    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="button button-primary button-large" type="submit">Iniciar sesión</button>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
